# API credentials have been moved to the .env file.
# Copy .env.example to .env and populate with your credentials.
#
# Required environment variables:
#   LLM_API_KEY         — API key for your OpenAI-compatible LLM provider
#   LLM_BASE_URL        — LLM API base URL
#   LLM_MODEL_PRO/MINI/LITE/CODE — model names for the routing roster
#   EMBEDDING_MODEL     — DashScope embedding model name
#   EMBEDDING_API_KEY   — DashScope API key
